<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초월 등급표</title>
<link id="theme-css" rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./ui.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<style>
/* ── tier.html 고유 스타일 (공통은 ui.css) ───────────────── */

/* 속성 색 — 패널 머리와 뱃지가 같이 씁니다 */
.panel-땅{--e:#c07a2e}  .panel-물{--e:#3d86d6}  .panel-불{--e:#d65450}
.panel-바람{--e:#4a9e5c} .panel-빛{--e:#d99a30}  .panel-어둠{--e:#8a6fd0}
.panel-황혼{--e:#c96393} .panel-여명{--e:#a58164} .panel-악몽{--e:#9b6ac4}

#top{margin-bottom:16px}
#search-bar{margin-bottom:10px}
#search-bar input{padding:13px 16px;font-size:16px}
#filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ftag{padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;
  border:1px solid var(--bd2);background:var(--sf);color:var(--dim);cursor:pointer;white-space:nowrap}
.ftag:hover{color:var(--text)}
.ftag.active{border-color:var(--gold);background:var(--accent-bg);color:var(--gold)}
#count{font-size:12.5px;color:var(--dimmer);margin-bottom:10px}
#grade-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
#grade-row .gl{font-size:12px;color:var(--dimmer);font-weight:600;margin-right:2px}
#grade-row input{width:84px;padding:7px 10px;border:1px solid var(--bd2);border-radius:6px;
  background:var(--sf);color:var(--text);font-family:var(--u-mono);font-size:13px;text-align:right}
#grade-row input:focus{outline:none;border-color:var(--gold)}
#grade-row .tilde{color:var(--dimmer);font-size:12px}
#grade-row .gsep{width:1px;height:18px;background:var(--bd);margin:0 4px}

#panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.panel{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--sf)}
.panel-header{display:flex;align-items:center;gap:10px;padding:12px 15px;
  font-size:15px;font-weight:700;color:var(--text);
  background:var(--sf2);border-bottom:1px solid var(--bd)}
.panel-header .elem-icon{width:34px;height:34px;border-radius:7px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--bg);flex-shrink:0}
.panel-header .elem-icon img{width:100%;height:100%;max-width:none;object-fit:cover}

.panel table{width:100%;border-collapse:collapse;font-size:13.5px;background:transparent}
.panel thead tr{background:transparent}
.panel th{padding:9px 8px;text-align:center;font-weight:600;font-size:11.5px;
  letter-spacing:.05em;color:var(--dimmer);border-bottom:1px solid var(--bd2);white-space:nowrap}
.panel th.left{text-align:left}
.panel td{padding:8px 8px;border-bottom:1px solid var(--border2);vertical-align:middle;color:var(--text)}
.panel td.center{text-align:center}
.panel tr:hover td{background:var(--sf2)}
.rank{font-family:var(--u-mono);font-size:12px;color:var(--dimmer);text-align:center;width:26px}
.dragon-img{width:36px;height:36px;max-width:none;border-radius:6px;object-fit:cover;display:block;margin:0 auto}
.img-placeholder{width:36px;height:36px;max-width:none;margin:0 auto;border-radius:6px;background:var(--sf2);
  border:1px dashed var(--bd2);display:flex;align-items:center;justify-content:center;
  color:var(--dimmer);font-size:10px}
.badge-type{font-size:11px;padding:3px 7px;border-radius:4px;background:var(--sf2);
  color:var(--dim);font-weight:700;white-space:nowrap}
.no-data td{text-align:center;padding:24px;color:var(--dimmer);font-size:13px}

/* 초월 보유 행 — 왼쪽 가는 선만 */
tr.ex-true td:first-child{box-shadow:inset 2px 0 0 var(--e,var(--gold))}

/* 등급 글자색 — 네온 글로우 제거 */
.lv-o,.chk-y{color:var(--ok) !important;font-weight:700}
.lv-x,.chk-n{color:var(--bad) !important;font-weight:700}
.t-blue{color:#5aa9d8 !important;font-weight:700;font-size:14px}
.t-gold{color:var(--gold) !important;font-weight:700;font-size:14px}
.t-silver{color:var(--text2) !important;font-weight:700;font-size:14px}
.t-pink{color:#c4879e !important;font-weight:700;font-size:14px}
.t-neg{color:var(--bad) !important;font-weight:700;font-size:14px}
.cd-yes{color:var(--ok);font-size:12px;font-weight:600}
.cd-no{color:var(--bad);font-size:12px;font-weight:600}
.cd-cs{color:var(--gold);font-size:12px;font-weight:600}

/* 속성 뱃지 — 파스텔 배경 대신 테마에 맞는 톤 */
.badge-elem{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:700;white-space:nowrap}
.e-땅{background:rgba(192,122,46,.16);color:#c07a2e}
.e-물{background:rgba(61,134,214,.16);color:#3d86d6}
.e-불{background:rgba(214,84,80,.16);color:#d65450}
.e-바람{background:rgba(74,158,92,.16);color:#4a9e5c}
.e-빛{background:rgba(217,154,48,.16);color:#d99a30}
.e-어둠{background:rgba(138,111,208,.16);color:#8a6fd0}
.e-황혼{background:rgba(201,99,147,.16);color:#c96393}
.e-여명{background:rgba(165,129,100,.16);color:#a58164}
.e-악몽{background:rgba(155,106,196,.16);color:#9b6ac4}

/* 넓은 표 (도감 탭) */
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl-wrap thead tr{background:transparent}
.tbl-wrap th{padding:9px 8px;text-align:center;font-weight:600;font-size:11.5px;
  letter-spacing:.05em;color:var(--dimmer);border-bottom:1px solid var(--bd2);white-space:nowrap}
.tbl-wrap th.left{text-align:left}
.tbl-wrap td{padding:10px 8px;border-bottom:1px solid var(--border2);
  vertical-align:middle;color:var(--text);text-align:center}
.tbl-wrap td.left{text-align:left;white-space:nowrap}
.tbl-wrap tr:hover td{background:var(--sf2)}
.dex-elem-icon{width:28px;height:28px;max-width:none;border-radius:4px;object-fit:cover;display:block;margin:0 auto}
.dex-elem-icon-placeholder{width:28px;height:28px;border-radius:4px;background:var(--sf2);
  border:1px dashed var(--bd);margin:0 auto}
.detail-btn{font-size:11.5px;padding:5px 11px;border-radius:4px;border:1px solid var(--bd2);
  background:var(--sf);color:var(--dim);cursor:pointer;font-weight:600}
.detail-btn:hover{border-color:var(--gold);color:var(--gold)}
.td-pc{display:table-cell}
.td-mobile{display:none}
.tab-content{display:none}
.tab-content.active{display:block}

/* 모달 */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:1000;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
#modal{background:var(--sf);border:1px solid var(--bd2);border-radius:12px;padding:24px;
  min-width:280px;max-width:min(90vw,460px);position:relative}
#modal-close{position:absolute;top:10px;right:12px;background:none;border:none;
  color:var(--dim);font-size:18px;cursor:pointer;line-height:1;padding:4px 8px}
#modal-close:hover{color:var(--text)}
#modal-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
#modal-body{font-size:13px;color:var(--text2);line-height:1.8}

@media(max-width:900px){
  #panels{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media(max-width:620px){
  #panels{grid-template-columns:1fr;gap:12px}
}
@media(max-width:600px){
  .tbl-wrap table{min-width:0 !important}
  .tbl-wrap thead{display:none}
  .tbl-wrap tbody tr{display:block;padding:10px 0;border-bottom:1px solid var(--bd)}
  .tbl-wrap tbody tr:hover td{background:transparent}
  .tbl-wrap td{border:0;padding:0}
  .td-pc{display:none !important}
  .td-mobile{display:flex !important}
  .row1{align-items:center;gap:9px;margin-bottom:7px}
  .row2{gap:0;justify-content:space-around;background:var(--sf2);border-radius:6px;padding:7px 0}
  .row2-cell{text-align:center;flex:1}
  .row2-cell .r2-label{font-size:11px;color:var(--dim);display:block}
  .row2-cell .r2-val{font-size:13px;display:block;margin-top:2px}
}

@media(max-width:760px){
  /* 이름이 "크로마 / 아카이아" 로 갈라지지 않게 옆 칸을 줄여 폭을 몰아줍니다 */
  .panel table td:nth-child(1),.panel table th:nth-child(1){width:22px;font-size:11px;padding-left:4px;padding-right:2px}
  .panel table td:nth-child(3),.panel table th:nth-child(3){width:46px;font-size:11.5px;padding-left:4px;padding-right:4px}
  .panel table td:nth-child(5),.panel table th:nth-child(5){width:38px;font-size:12px;padding-left:2px;padding-right:2px}
  .panel table td:nth-child(6),.panel table th:nth-child(6){width:48px;font-size:13px;padding-left:2px;padding-right:6px}
  .panel table td:nth-child(4){font-size:13px;line-height:1.3}
}
</style>

const tierElemOrder=["땅","물","불","바람","빛","어둠","황혼","여명","악몽"];
const tierTypes=["전체","공방","공격","방어","체공","체방","체력"];
let eTFilters=new Set(); let tTFilters=new Set();

function buildFilters(){
  const fr=document.getElementById("filter-row");
  fr.innerHTML="";

  // 속성 필터
  const eLabel=document.createElement("span");
  eLabel.textContent="속성";
  eLabel.style="font-size:11px;color:#888;align-self:center;margin-right:2px";
  fr.appendChild(eLabel);
  ["땅","물","불","바람","빛","어둠","황혼","여명","악몽"].forEach(e=>{
    const b=document.createElement("button");
    b.className="ftag"+(eTFilters.has(e)?" active":"");
    b.textContent=e;
    b.onclick=()=>{
      if(eTFilters.has(e)) eTFilters.delete(e);
      else eTFilters.add(e);
      render();
    };
    fr.appendChild(b);
  });

  // 구분선
  const sep=document.createElement("div");
  sep.style="width:100%;height:6px";
  fr.appendChild(sep);

  // 타입 필터
  const tLabel=document.createElement("span");
  tLabel.textContent="타입";
  tLabel.style="font-size:11px;color:#888;align-self:center;margin-right:2px";
  fr.appendChild(tLabel);
  ["체력","공격","방어","체공","체방","공방"].forEach(t=>{
    const b=document.createElement("button");
    b.className="ftag"+(tTFilters.has(t)?" active":"");
    b.textContent=t;
    b.onclick=()=>{
      if(tTFilters.has(t)) tTFilters.delete(t);
      else tTFilters.add(t);
      render();
    };
    fr.appendChild(b);
  });
}

let gMin=null,gMax=null;

function setGrade(mn,mx){
  gMin=mn;gMax=mx;
  const a=document.getElementById("g-min"),b=document.getElementById("g-max");
  if(a)a.value=mn==null?"":mn;
  if(b)b.value=mx==null?"":mx;
  render();
}
function readGrade(){
  const a=document.getElementById("g-min"),b=document.getElementById("g-max");
  const p=v=>{v=String(v).trim();if(!v)return null;const n=parseFloat(v);return isNaN(n)?null:n;};
  gMin=p(a?a.value:"");gMax=p(b?b.value:"");
  render();
}
function buildGradeRow(){
  const r=document.getElementById("grade-row");
  if(!r)return;
  // 데이터에 있는 등급 범위
  const all=data.map(d=>d.g).filter(g=>typeof g==="number"&&g>0);
  const lo=all.length?Math.min(...all):0, hi=all.length?Math.max(...all):7;
  const presets=[[7,null,"7.0 이상"],[6.5,null,"6.5 이상"],[6,null,"6.0 이상"],[5,5.999,"5점대"],[null,null,"전체"]];
  const on=(mn,mx)=>gMin===mn&&gMax===mx;
  r.innerHTML=
    '<span class="gl">등급</span>'+
    '<input id="g-min" type="number" step="0.025" min="'+lo+'" max="'+hi+'" placeholder="최소" '+
      'value="'+(gMin==null?"":gMin)+'" oninput="readGrade()" aria-label="최소 등급">'+
    '<span class="tilde">~</span>'+
    '<input id="g-max" type="number" step="0.025" min="'+lo+'" max="'+hi+'" placeholder="최대" '+
      'value="'+(gMax==null?"":gMax)+'" oninput="readGrade()" aria-label="최대 등급">'+
    '<span class="gsep"></span>'+
    presets.map(p=>'<button class="ftag'+(on(p[0],p[1])?" active":"")+'" '+
      'onclick="setGrade('+(p[0]==null?"null":p[0])+','+(p[1]==null?"null":p[1])+')">'+p[2]+'</button>').join("");
}

function render(){
  buildFilters();
  buildGradeRow();

  panels.innerHTML="";

  let total=0;

    if(gMin!=null) list=list.filter(d=>d.g>=gMin-1e-9);
    if(gMax!=null) list=list.filter(d=>d.g<=gMax+1e-9);
    if(!list.length) return;
    list=list.slice().sort((a,b)=>b.g-a.g);

    const cfg=elemConfig[elem];

      :`<div class="elem-icon" style="font-size:18px;background:rgba(0,0,0,0.25);width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center">${elem[0]}</div>`;

    let rows="";
    list.forEach((d,i)=>{
      const imgMap={"땅":"img1","물":"img2","불":"img3","바람":"img4","빛":"img5","어둠":"img6","황혼":"img7","여명":"img8","악몽":"img9"};
      const imgKey=imgMap[d.e]||"img1";
      const imgSrc=d[imgKey]||"";
      const imgCell=imgSrc
        ?`<img src="${imgSrc}" class="dragon-img" alt="${d.n}">`
        :`<div class="img-placeholder"></div>`;
      rows+=`<tr class="${d.ex?'ex-true':'ex-false'}">`+`
        <td class="center rank">${i+1}</td>
        <td class="center" style="width:52px">${imgCell}</td>
        <td class="center"><span class="badge-type">${d.t}</span></td>
        <td style="font-size:13.5px;font-weight:500">${d.n}</td>
        <td class="center ${d.lv==='O'?'lv-o':'lv-x'}">${d.lv}</td>
        <td class="center ${tierClass(d.g)}">${Number.isInteger(d.g)?d.g.toFixed(1):d.g}</td>
      </tr>`;
    });

    panel.innerHTML=`
      <div class="panel-header">
        ${iconHtml}
        <span>${cfg.label}</span>
      </div>
      <table>
        <thead><tr>
          <th style="width:24px"></th>
          <th style="width:42px"></th>
          <th class="center">타입</th>
          <th class="left">드래곤</th>
          <th class="center">레벨업</th>
          <th class="center">등급</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    panels.appendChild(panel);
  });

  const rng=(gMin!=null||gMax!=null)
    ? ` · 등급 ${gMin!=null?gMin:"처음"} ~ ${gMax!=null?gMax:"끝"}` : "";
  document.getElementById("count").textContent=`${total}마리${rng}`;
}

render();
</script>

<script>
/* ── data-theme 동기화 (theme.js 연동) ── */
(function(){
  var link = document.getElementById('theme-css');
  if (!link) return;
  var sync = function() {
    var c = document.getElementById('custom-theme-style');
    if (c && c.textContent && c.textContent.length > 0) {
      document.documentElement.removeAttribute('data-theme');
      return;
    }
    var m = String(link.href || '').match(/theme-(dark|light|beige)\.css/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'dark');
  };
  sync();
  new MutationObserver(sync).observe(link, { attributes: true, attributeFilter: ['href'] });
  new MutationObserver(sync).observe(document.head, { childList: true, subtree: true, characterData: true });
})();
</script>
</body>
</html>
